<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=475, user-scalable=no">
  <title>OPENMURA-1周年記念</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f5f7;
      margin: 0;
      padding: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 2em;
    }
  
    .control {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
  
    select, button {
      padding: 10px;
      font-size: 1em;
      border-radius: 8px;
    }
  
    select {
      border: 1px solid #ccc;
    }
  
    button {
      border: none;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s;
    }
  
    button:hover {
      background: #45a049;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  
    #message {
      color: #e53935;
      margin-top: 10px;
      font-weight: bold;
    }
  
iframe {
  width: 375px;  /* iPhone SE (2nd/3rd) 横幅 */
  height: 667px; /* iPhone SE 高さ */
  border: 2px solid #ddd;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  background: white;
}
  </style>
  
</head>
<body>

<h1>過去のアーカイブ</h1>

  </select>
  <button onclick="loadArchive()">表示</button>
</div>

<div id="message"></div>

<iframe id="archiveFrame"></iframe>

<script>
window.onload = function(){
  if (localStorage.getItem("1-v") != true) {
    alert("古参の人も新参の人も\n\n1周年記念を見てくれてありがと！！");
    alert("ここでは、過去のwebsiteの更新を見れるよ！！");
  }
  localStorage.setItem("1-v","true");
}
function loadArchive() {
  const select = document.getElementById('archiveSelect');
  const date = select.value;
  const frame = document.getElementById('archiveFrame');
  const message = document.getElementById('message');

  if (date) {
    const url = date;

    message.textContent = "";
    frame.style.display = "none";
    frame.src = url;

    const tester = document.createElement('iframe');
    tester.style.display = "none";
    document.body.appendChild(tester);
    tester.src = url;

    tester.onload = function() {
      frame.style.display = "block";
      tester.remove();
    };
    tester.onerror = function() {
      message.textContent = "指定された日付のデータはありません。";
      frame.src = "";
      tester.remove();
    };
  } else {
    alert("日付を選んでください！");
  }
}
</script>

</body>
</html>
