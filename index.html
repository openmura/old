<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OPENMURA-1周年記念</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f5f7;
      margin: 0;
      padding: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 2em;
    }
  
    .control {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
  
    select, button {
      padding: 10px;
      font-size: 1em;
      border-radius: 8px;
    }
  
    select {
      border: 1px solid #ccc;
    }
  
    button {
      border: none;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s;
    }
  
    button:hover {
      background: #45a049;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  
    #message {
      color: #e53935;
      margin-top: 10px;
      font-weight: bold;
    }
  
    iframe {
      width: 100%;
      max-width: 1000px;
      height: 500px;
      border: 2px solid #ddd;
      border-radius: 2px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      background: white;
    }
  
    @media (max-width: 414px) {
      body {
        padding: 2px;
      }
  
      iframe {
        width: 100%;
        max-width: 375px;
        height: 500px;
      }
  
      .control {
        flex-direction: column;
      }
    }
    .switch-container {
  position: relative;
  width: 200px;
  margin-bottom: 20px;
}

.switch {
  display: flex;
  background: #ddd;
  border-radius: 30px;
  overflow: hidden;
  position: relative;
}

.switch label {
  flex: 1;
  text-align: center;
  padding: 10px 0;
  cursor: pointer;
  z-index: 2;
  font-size: 1em;
  color: #333;
}

.switch-container input[type="radio"] {
  display: none;
}

.slider {
  position: absolute;
  top: 0;
  left: 0;
  width: 50%;
  height: 100%;
  background: #2196F3;
  border-radius: 30px;
  transition: all 0.3s;
  z-index: 1;
}

#mobile:checked ~ .switch .slider {
  left: 50%;
}
  </style>
  
</head>
<body>

<h1>過去のアーカイブ</h1>
<div class="switch-container">
  <input type="radio" name="viewmode" id="pc" checked onclick="setPCMode()">
  <input type="radio" name="viewmode" id="mobile" onclick="setMobileMode()">
  <div class="switch">
    <label for="pc">PC</label>
    <label for="mobile">スマホ</label>
    <div class="slider"></div>
  </div>
</div>
<div class="control">
  <select id="archiveSelect">
    <option value="">日付を選んでください</option>
    <option value="version/2024-09-04/">2024-09-04</option>
    <option value="version/2024-09-07/">2024-09-07</option>
    <option value="version/2024-09-08/">2024-09-08</option>
    <option value="version/2024-10-20/">2024-10-20</option>
    <option value="version/2024-12-14/">2024-12-14</option>
    <option value="version/2024-12-15/">2024-12-15</option>
    <option value="version/2024-12-16/">2024-12-16</option>
    <option value="version/2024-12-17/">2024-12-17</option>
    <option value="version/2024-12-18/">2024-12-18</option>
    <option value="version/2024-12-19/">2024-12-19</option>
    <option value="version/2024-12-21/">2024-12-21</option>
    <option value="version/2024-12-22/">2024-12-22</option>
    <option value="version/2024-12-23/">2024-12-23</option>
    <option value="version/2024-12-26/">2024-12-26</option>
    <option value="version/2024-12-27/">2024-12-27</option>
    <option value="version/2025-01-11/">2025-01-11</option>
    <option value="version/2025-01-12/">2025-01-12</option>
    <option value="version/2025-01-13/">2025-01-13</option>
    <option value="version/2025-01-16/">2025-01-16</option>
    <option value="version/2025-01-17/">2025-01-17</option>
    <option value="version/2025-01-18/">2025-01-18</option>
    <option value="version/2025-01-19/">2025-01-19</option>
    <option value="version/2025-01-23/">2025-01-23</option>
    <option value="version/2025-01-25/">2025-01-25</option>
    <option value="version/2025-01-26/">2025-01-26</option>
    <option value="version/2025-01-28/">2025-01-28</option>
    <option value="version/2025-02-08/">2025-02-08 誤作動あり</option>
    <option value="version/2025-02-09/">2025-02-09 誤作動あり</option>
    <option value="version/2025-02-10/">2025-02-10 誤作動あり</option>
    <option value="version/2025-02-11/">2025-02-11</option>
    <option value="version/2025-02-12/">2025-02-12</option>
    <option value="version/2025-02-24/">2025-02-24</option>
    <option value="version/2025-03-18/">2025-03-18</option>
    <option value="version/2025-03-30/">2025-03-30</option>
    <option value="https://openmura.github.io/?guestmode">現在</option>
  </select>
  <button onclick="loadArchive()">表示</button>
</div>

<div id="message"></div>

<iframe id="archiveFrame"></iframe>

<script>
window.onload = function(){
  if (localStorage.getItem("1-v") != true) {
    alert("古参の人も新参の人も\n\n1周年記念を見てくれてありがと！！");
    alert("ここでは、過去のwebsiteの更新を見れるよ！！");
  }
  localStorage.setItem("1-v","true");
}
function loadArchive() {
  const select = document.getElementById('archiveSelect');
  const date = select.value;
  const frame = document.getElementById('archiveFrame');
  const message = document.getElementById('message');

  if (date) {
    const url = date;

    message.textContent = "";
    frame.style.display = "none";
    frame.src = url;

    const tester = document.createElement('iframe');
    tester.style.display = "none";
    document.body.appendChild(tester);
    tester.src = url;

    tester.onload = function() {
      frame.style.display = "block";
      tester.remove();
    };
    tester.onerror = function() {
      message.textContent = "指定された日付のデータはありません。";
      frame.src = "";
      tester.remove();
    };
  } else {
    alert("日付を選んでください！");
  }
}
function setPCMode() {
  const frame = document.getElementById('archiveFrame');
  frame.style.width = '100%';
  frame.style.maxWidth = '1000px';
  frame.style.height = '500px';
}

function setMobileMode() {
  const frame = document.getElementById('archiveFrame');
  
  if (window.innerWidth <= 480) {
    frame.style.width = '100%';
    frame.style.maxWidth = '100%';
    frame.style.height = '600px';
  } else {
    frame.style.width = '375px';
    frame.style.maxWidth = '375px';
    frame.style.height = '667px';
  }
}
</script>

</body>
</html>
